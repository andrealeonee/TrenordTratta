name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Workload MAUI Android
        run: dotnet workload install maui-android

      - name: Test Core
        run: dotnet test tests/TrenordTratta.Core.Tests -c Release

      - name: Publish APK
        run: >
          dotnet publish src/TrenordTratta.Mobile/TrenordTratta.Mobile.csproj
          -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*-Signed.apk
